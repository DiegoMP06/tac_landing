services:
    wordpress:
        build:
            context: .
            dockerfile: docker/Dockerfile
        container_name: tac_wordpress_app
        restart: always
        environment:
            DB_NAME: ${MYSQL_DATABASE}
            DB_USER: ${MYSQL_USER}
            DB_PASSWORD: ${MYSQL_PASSWORD}
            DB_HOST: ${DB_HOST}
            WP_ENV: production
            WP_HOME: ${WP_HOME}
            WP_SITEURL: ${WP_SITEURL}
        volumes:
            - tac_wordpress_uploads:/var/www/html/web/app/uploads
        networks:
            - coolify

volumes:
    tac_wordpress_uploads:

networks:
    coolify:
        external: true
