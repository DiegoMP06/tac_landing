services:
    wordpress:
        build:
            context: .
            dockerfile: docker/Dockerfile
        restart: always
        environment:
            DB_NAME: ${DB_NAME:-landing-page}
            DB_USER: ${DB_USER:-mariadb}
            DB_PASSWORD: ${DB_PASSWORD}
            DB_HOST: ${DB_HOST}
            WP_ENV: ${WP_ENV:-production}
            WP_HOME: ${WP_HOME}
            WP_SITEURL: ${WP_SITEURL}
        volumes:
            - tac_wordpress_uploads:/var/www/html/web/app/uploads
        networks:
            - coolify

volumes:
    tac_wordpress_uploads:

networks:
    coolify:
        external: true
