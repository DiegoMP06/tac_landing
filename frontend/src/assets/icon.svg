<svg viewBox="0 0 1254 1254" xmlns="http://www.w3.org/2000/svg">
    <!-- Fondo blanco -->
    <rect x="0" y="0" width="1254" height="1254" fill="#ffffff" />

    <!-- Título superior -->
    <text x="627" y="240" text-anchor="middle"
        font-family="'Poppins', 'Segoe UI', Arial, sans-serif"
        font-weight="700" font-size="60" fill="#0b1830">
        The Americas Conference
    </text>

    <!-- Icono: una sola línea que se divide en 3 rectángulos huecos -->
    <g fill="#1b5e34" transform="translate(61.5,62)">
        <rect x="472" y="278" width="185" height="25" />
        <rect x="472" y="278" width="25" height="449" />
        <rect x="632" y="278" width="25" height="449" />

        <rect x="421" y="435" width="180" height="26" />
        <rect x="421" y="435" width="25" height="292" />
        <rect x="577" y="435" width="25" height="233" />

        <rect x="524" y="514" width="186" height="26" />
        <rect x="524" y="514" width="25" height="154" />
        <rect x="685" y="514" width="25" height="213" />

        <rect x="524" y="655" width="77" height="25" />
        <rect x="421" y="702" width="76" height="25" />
        <rect x="632" y="702" width="78" height="25" />
    </g>

    <!-- Subtítulos -->
    <text x="627" y="880" text-anchor="middle"
        font-family="'Poppins', 'Segoe UI', Arial, sans-serif"
        font-weight="700" font-size="54" fill="#0b1830">
