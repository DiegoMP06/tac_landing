    </text>
    <text x="627" y="944" text-anchor="middle"
        font-family="'Poppins', 'Segoe UI', Arial, sans-serif"
        font-weight="700" font-size="54" fill="#0b1830">
        Conference of Mayors
    </text>
    <text x="627" y="1008" text-anchor="middle"
        font-family="'Poppins', 'Segoe UI', Arial, sans-serif"
        font-weight="700" font-size="54" fill="#0b1830">
        Conference of Universities
    </text>
</svg>